<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111625" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Titanium Steel Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Pillar Gradient -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#d97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle badge -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Gold Architectural Triangle & High-rise Building Pillars -->
  <g transform="translate(156, 75)" filter="url(#glow)">
    <!-- Outer Golden Triangle Chevron -->
    <polygon points="100,0 200,165 170,165 100,45 30,165 0,165" fill="url(#goldGrad)" />
    <!-- Chevron Base Line -->
    <rect x="0" y="157" width="200" height="10" rx="3" fill="url(#goldGrad)" />

    <!-- 3 Skyscraper Building Pillars inside the Chevron -->
    <!-- Left Column -->
    <path d="M 46,150 L 46,95 L 68,82 L 68,150 Z" fill="url(#pillarGrad)" />
    <!-- Center Column (Tallest) -->
    <path d="M 74,150 L 74,58 L 100,42 L 126,58 L 126,150 Z" fill="#ffffff" />
    <!-- Right Column -->
    <path d="M 132,150 L 132,82 L 154,95 L 154,150 Z" fill="url(#pillarGrad)" />
  </g>

  <!-- Golden Divider Accent -->
  <rect x="96" y="278" width="320" height="7" rx="3.5" fill="url(#goldGrad)" />

  <!-- Bold GPS Lettermark -->
  <g transform="translate(256, 396)">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="118" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="-2" 
          text-anchor="middle" 
          fill="url(#steelGrad)">GPS</text>
  </g>
</svg>
